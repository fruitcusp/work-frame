name: redroid-test
on:
  workflow_dispatch:
# Thin shell only (house standard 25/11): real logic lives in the vault
# script brain/pipelines/redroid-test.sh.
jobs:
  run:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 70
    permissions:
      contents: read
    env:
      DATA_TOKEN: ${{ secrets.DATA_TOKEN }}
      RUN_ID: ${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: fruitcusp/house-data
          token: ${{ secrets.DATA_TOKEN }}
          path: .vault
      - name: Run redroid test (logic in vault)
        timeout-minutes: 65
        run: bash .vault/brain/pipelines/redroid-test.sh
