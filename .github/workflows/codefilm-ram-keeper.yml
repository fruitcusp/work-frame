name: codefilm-ram-keeper
on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"
# Thin shell only (house standard): real scaling logic lives in the vault script
# brain/pipelines/codefilm-scale.sh — machines follow queue depth, cap 20/lane
# (policy set by Sep, 2026-11-29). This workflow only checks out the vault + runs it.
jobs:
  keep:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          repository: fruitcusp/house-data
          token: ${{ secrets.DATA_TOKEN }}
          path: .vault
      - name: Scale machines (logic in vault)
        env:
          GH_TOKEN: ${{ secrets.DATA_TOKEN }}
        run: bash .vault/brain/pipelines/codefilm-scale.sh
