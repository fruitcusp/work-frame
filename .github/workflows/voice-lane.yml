name: voice-lane
on:
  workflow_dispatch:
    inputs:
      queue_id:
        description: "Queue ID in vault (opaque)"
        required: true
        type: string
# NO shared concurrency group (house rule 25/11): each run works on its own
# queue_id and writes to its own path in the vault, so runs never cancel
# or block each other.
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: write
    # Pha 2 (28/11/2026): NO container — runner khong con engine rieng, chi can
    # python3 + curl + ffmpeg co san tren ubuntu-latest; no nop viec qua API
    # TuTaLab (be am) va chep ket qua ve ket. Image wf-worker:voice da loai bo.
    env:
      DATA_TOKEN: ${{ secrets.DATA_TOKEN }}
      VAULT_DIR: ${{ github.workspace }}/.vault
      RUN_ID: ${{ github.run_id }}
      QUEUE_ID: ${{ inputs.queue_id }}
      FANOUT_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: fruitcusp/house-data
          token: ${{ secrets.DATA_TOKEN }}
          path: .vault
      - name: Run lane (logic in vault)
        timeout-minutes: 25
        run: bash .vault/brain/pipelines/workframe-voice-run.sh
