name: build-voice-image
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Login GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GH_TOKEN" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: Build + push slim voice image
        run: |
          docker build -t ghcr.io/fruitcusp/wf-worker:voice docker/voice-worker
          docker push ghcr.io/fruitcusp/wf-worker:voice
          docker image inspect ghcr.io/fruitcusp/wf-worker:voice --format 'voice_id={{.Id}} size={{.Size}}'
          echo "VOICE_IMAGE_DONE"
