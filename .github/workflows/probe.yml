name: probe
on:
  workflow_dispatch:
jobs:
  probe-full:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/fruitcusp/tutalab-worker:latest
    steps:
      - name: Probe tools in full image
        run: |
          echo "PROBE_START"
          for t in gh curl wget git python3 ffmpeg ffprobe jq; do command -v $t >/dev/null 2>&1 && echo "TOOL $t YES" || echo "TOOL $t NO"; done
          python3 -c "import vieneu; print('VIENEU_OK')" || echo "VIENEU_FAIL"
          test -f /tmp/rustdist/vieneu-rs && echo "RUSTDIST_OK" || echo "RUSTDIST_NO"
          ls /opt/music 2>/dev/null | head -3 || echo "MUSIC_NO"
          echo "PROBE_END"
  probe-lite:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/fruitcusp/tutalab-worker:lite
    steps:
      - name: Probe tools in lite image
        run: |
          echo "PROBE_START"
          for t in gh curl wget git python3 ffmpeg ffprobe jq; do command -v $t >/dev/null 2>&1 && echo "TOOL $t YES" || echo "TOOL $t NO"; done
          python3 -c "import vieneu; print('VIENEU_OK')" || echo "VIENEU_FAIL"
          echo "PROBE_END"
  probe-host:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe host tools
        run: |
          for t in gh curl git python3 ffmpeg; do command -v $t >/dev/null 2>&1 && echo "TOOL $t YES" || echo "TOOL $t NO"; done
