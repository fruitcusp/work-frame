name: audio2midi-lane
on:
  workflow_dispatch:
    inputs:
      queue_id:
        description: "Queue ID in vault (opaque)"
        required: true
        type: string
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ secrets.DATA_TOKEN }}
      DATA_TOKEN: ${{ secrets.DATA_TOKEN }}
      VAULT_DIR: ${{ github.workspace }}/.vault
      RUN_ID: ${{ github.run_id }}
      QUEUE_ID: ${{ inputs.queue_id }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: actions/checkout@v4
        with:
          repository: fruitcusp/house-data
          token: ${{ secrets.DATA_TOKEN }}
          path: .vault
      - name: Run lane (logic in vault)
        timeout-minutes: 55
        run: bash .vault/brain/pipelines/basicpitch-run.sh
