name: stickman-ram-machine
on:
  workflow_dispatch:
# Thin shell only (house standard): real logic lives in the vault script
# brain/pipelines/stickman-ram-machine.sh. No concurrency group.
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    permissions:
      contents: read
    env:
      DATA_TOKEN: ${{ secrets.DATA_TOKEN }}
      AG_KEY: ${{ secrets.AG_KEY }}
      RUN_ID: ${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: fruitcusp/house-data
          token: ${{ secrets.DATA_TOKEN }}
          path: .vault
      - name: Run machine (logic in vault)
        timeout-minutes: 350
        run: bash .vault/brain/pipelines/stickman-ram-machine.sh
