name: probe2
on:
  workflow_dispatch:
jobs:
  probe-rust:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/fruitcusp/tutalab-worker:latest
    steps:
      - name: Discover rust engine interface from the binary itself
        run: |
          echo "=== DIST LIST ==="
          ls /tmp/rustdist/ 2>/dev/null
          ls /tmp/rustdist/model/ 2>/dev/null
          ls /tmp/rustdist/assets/ 2>/dev/null | head -5
          ls /tmp/rustdist/syslibs/ 2>/dev/null | head -5
          echo "=== HELP ==="
          /tmp/rustdist/syslibs/ld-linux-x86-64.so.2 --library-path /tmp/rustdist/syslibs /tmp/rustdist/vieneu-rs --help 2>&1 | head -n 40 || echo "HELP_FAILED"
          echo "=== TRIAL ==="
          mkdir -p /tmp/rsprobe/out
          cat > /tmp/rsprobe/units.json <<'JSON'
          {"voice": "Ngọc Huyền", "units": [{"id": "00", "text": "Xin chào, đây là đoạn đọc thử bằng engine mới."}]}
          JSON
          DEADLINE=$(( $(date +%s) + 900 ))
          cd /tmp/rustdist && timeout 600 /tmp/rustdist/syslibs/ld-linux-x86-64.so.2 --library-path /tmp/rustdist/syslibs /tmp/rustdist/vieneu-rs --model-dir /tmp/rustdist/model/int8 --codec-dir /tmp/rustdist/model/codec --model-root /tmp/rustdist/model --dict /tmp/rustdist/assets/sea_g2p.bin --voices-file /tmp/rustdist/assets/voices_v3_turbo.json worker /tmp/rsprobe/units.json '' '' /tmp/rsprobe/out $DEADLINE 0 2>&1 | tail -5
          echo "TRIAL_EXIT=$?"
          ls -la /tmp/rsprobe/out/ 2>/dev/null
          echo "=== PROBE_END ==="
